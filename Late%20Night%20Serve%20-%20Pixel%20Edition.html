      GL.st = -1; GL.t = 0;
      fallOverlay.style.display = 'flex';
      fallOverlay.classList.add('falling');

      $('ctl').style.display = 'none';
      $('crt').style.display = 'none';
      tone(72, 1.1, 'sawtooth', .4, 28);
      setTimeout(() => {
        if (fallPhase) {
          fallOverlay.classList.remove('falling');
          fallOverlay.classList.add('descend');
          $('secretFallText').textContent = 'Bạn rơi sâu xuống bóng tối...';
        }
      }, 650);
    }

    if (fallPhase) {

      if (elapsed >= 2.8) {
        fallPhase = false;
        fallOverlay.style.display = 'none';
        fallOverlay.classList.remove('descend', 'falling');

        }

      }
    }

    // A fresh shift resets the one-shot midnight transition.
    if (st === 'play' && G && G.night !== 3 && !GL) {
      wasNightThree = false;
    }
  };

  // Make the event retryable after the player restarts the shift.
  const oldBegin = begin;
  begin = function() {
    fallPhase = false;
    fallOverlay.style.display = 'none';
    fallOverlay.classList.remove('descend', 'falling');
    wasNightThree = false;
    oldBegin();
  };
})();
</script>
